version: "3.9"

services:

  backend:
    build: ./backend

    container_name: ai-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/ai-db:/app/ai-db
      - ./backend/upload_document:/app/upload_document

    restart: unless-stopped

  frontend:
    build: ./frontend

    container_name: ai-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped